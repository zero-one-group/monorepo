# https://moonrepo.dev/docs/config/project
# yaml-language-server: $schema=https://moonrepo.dev/schemas/v2/project.json
$schema: 'https://moonrepo.dev/schemas/v2/project.json'

layer: application
language: go
toolchains:
    default: null
stack: backend
tags: ['app', 'backend']

# Overrides the name (identifier) of the project
id: 'go-modular'

project:
    title: 'go-modular'
    description: '_CHANGE_ME_DESCRIPTION_'

tasks:
    dev:
        command: 'watchexec -r -e go,toml -w . --no-vcs-ignore -- go run -tags debug ./cmd/'
        args: ['serve']
        deps: [kill-port, generate-swagger]
        options:
            cache: false
            envFile: '.env'

    run:
        command: 'go run -tags debug $projectRoot/cmd/'
        deps: [kill-port, generate-swagger]
        options:
            cache: false
            interactive: true
            mergeOutputs: replace
            outputStyle: buffer
            mergeArgs: replace
            envFile: '.env'

    build:
        env:
            LDFLAGS_BUILD_HASH: '-X $project/internal.BuildHash=$vcsRevision'
            LDFLAGS_BUILD_DATE: '-X $project/internal.BuildDate=$datetime'
            LDFLAGS_STATIC: "-w -s -extldflags '-static'"
        script: |
            go build -tags prod -trimpath -buildmode=pie -buildvcs=false \
              --ldflags="$LDFLAGS_STATIC $LDFLAGS_BUILD_DATE $LDFLAGS_BUILD_HASH \
              -X $project/internal.Version=$(jq -r .version <$workspaceRoot'/package.json')" \
              -o $projectRoot/build/release/$project $projectRoot/cmd/
        deps: [tidy, generate-swagger]
        options:
            mergeArgs: append
            envFile: '.env'

    # Installs the compile-time auto-instrumentation toolchain.
    # Run once before `build-otel`; it is a no-op if otelc is already on PATH.
    install-otelc:
        command: 'go install go.opentelemetry.io/otelc/tool/cmd/otelc@v1.1.0'
        options:
            cache: false
            runInCI: false

    # Same build as `build`, wrapped in otelc so the OpenTelemetry SDK and the
    # net/http, log/slog and runtime instrumentations are injected at compile
    # time. No application source depends on this — a plain `build` still works
    # and simply produces an uninstrumented binary.
    #
    # `-buildmode=pie` is deliberately omitted: otelc rewrites the build graph
    # and PIE offers no benefit for a locally traced binary.
    build-otel:
        env:
            LDFLAGS_BUILD_HASH: '-X $project/internal.BuildHash=$vcsRevision'
            LDFLAGS_BUILD_DATE: '-X $project/internal.BuildDate=$datetime'
        script: |
            otelc go build -tags prod -trimpath -buildvcs=false \
              --ldflags="$LDFLAGS_BUILD_DATE $LDFLAGS_BUILD_HASH \
              -X $project/internal.Version=$(jq -r .version <$workspaceRoot'/package.json')" \
              -o $projectRoot/build/release/$project-otel $projectRoot/cmd/
        deps: [tidy, generate-swagger]
        options:
            mergeArgs: append
            envFile: '.env'
            cache: false

    # Runs the instrumented binary. Requires Jaeger:
    #   pnpm run compose:instrumented   (UI on http://localhost:16686)
    start-otel:
        command: 'build/release/$project-otel'
        args: ['serve']
        deps: [kill-port, build-otel]
        options:
            cache: false
            outputStyle: stream
            mergeArgs: replace
            envFile: '.env'

    start:
        command: 'build/release/$project'
        args: ['serve']
        deps: [kill-port]
        options:
            cache: false
            outputStyle: buffer
            mergeArgs: replace
            envFile: '.env'

    test:
        script: 'gotestsum --format short-verbose --'
        args: ['-count=1', '-v', './internal/...', './modules/...', './pkg/...']
        deps: ['tidy']
        options:
            cache: false
            runFromWorkspaceRoot: false
            mergeOutputs: replace
            outputStyle: buffer
            mergeArgs: replace
            envFile: '.env'

    coverage:
        script: |
            gotestsum --format testname -- -coverprofile=build/coverage.out ./internal/... ./modules/... ./pkg/...
            go tool cover -html=$projectRoot/build/coverage.out -o $projectRoot/build/coverage.html
            go tool cover -func=$projectRoot/build/coverage.out | tail -1
        deps: ['tidy']
        options:
            shell: true
            cache: false
            runFromWorkspaceRoot: false
            mergeOutputs: replace
            outputStyle: buffer
            mergeArgs: replace
            envFile: '.env'

    format:
        command: 'gofmt -s -w $projectRoot'
        options:
            envFile: '.env'
            cache: false

    tidy:
        command: 'go mod tidy'

    kill-port:
        # This is a hack for killing the listen port before starting the app
        command: 'pnpm --package=kill-port-process-cli dlx kill-port 8000'
        deps: [tidy]
        options:
            envFile: '.env'
            internal: true
            outputStyle: none

    dump:
        script: |
            mkdir -p $workspaceRoot/tmp/db_dump
            DUMP_FILENAME="$project-$(date -u +%y%m%d_%H%M%S)"

            docker-compose -f $workspaceRoot/compose.yaml exec pgsql pg_dump -Fp --no-acl \
              --no-owner --no-privileges -U postgres --schema=public --schema-only \
              postgres > $workspaceRoot/tmp/db_dump/$DUMP_FILENAME-schema_only.sql

            docker-compose -f $workspaceRoot/compose.yaml exec pgsql pg_dump -Fp --no-acl \
              --no-owner --no-privileges -U postgres --schema=public \
              postgres > $workspaceRoot/tmp/db_dump/$DUMP_FILENAME-with_data.sql
        options:
            mergeEnv: replace
            runFromWorkspaceRoot: true
            outputStyle: buffer-only-failure
            interactive: false
            runInCI: false
            cache: false
            shell: true

    install-mockery:
        command: './scripts/install_mockery.sh v3.5.1'
        options:
            runFromWorkspaceRoot: true
            shell: true
            runInCI: false
            cache: false

    generate-swagger:
        script: >
            swag init -o $projectRoot/docs -d cmd,internal,modules --parseDependency
            && swag fmt --dir $projectRoot/docs
            && go mod tidy
        options:
            cache: false
            runFromWorkspaceRoot: false
            outputStyle: buffer-only-failure
            mergeOutputs: replace
            mergeArgs: replace
            envFile: '.env'

    generate-mock:
        # command: "docker run --network=host --rm -it --env-file $projectRoot/.env -v $projectRoot:/src -w /src vektra/mockery:3mockery"
        command: 'mockery'
        options:
            cache: false
            runFromWorkspaceRoot: false
            outputStyle: buffer-only-failure
            mergeOutputs: replace
            mergeArgs: replace
            envFile: '.env'

    docker-build:
        script: |
            DOCKER_IMAGE="$(jq -r .name <$workspaceRoot'/package.json')-$project" \
            DOCKER_IMAGE_VERSION="$(jq -r .version <$workspaceRoot'/package.json')" \
            && docker build -f $projectRoot/Dockerfile . -t $DOCKER_IMAGE:$DOCKER_IMAGE_VERSION \
            && docker image list --filter reference=$DOCKER_IMAGE\*
        options:
            mergeEnv: replace
            runFromWorkspaceRoot: true
            interactive: false
            outputStyle: stream
            runInCI: false
            cache: false
            shell: true

    docker-run:
        script: |
            DOCKER_IMAGE="$(jq -r .name <$workspaceRoot'/package.json')-$project" \
            DOCKER_IMAGE_VERSION="$(jq -r .version <$workspaceRoot'/package.json')" \
            && docker run --network=host --rm -it --env-file $projectRoot/.env \
              --name $DOCKER_IMAGE $DOCKER_IMAGE:$DOCKER_IMAGE_VERSION
        options:
            mergeEnv: replace
            outputStyle: stream
            runFromWorkspaceRoot: true
            interactive: true
            runInCI: false
            cache: false
            shell: true

    docker-shell:
        script: |
            DOCKER_IMAGE="$(jq -r .name <$workspaceRoot'/package.json')-$project" \
            DOCKER_IMAGE_VERSION="$(jq -r .version <$workspaceRoot'/package.json')" \
            && docker run --network=host --rm -it --env-file $projectRoot/.env \
              --entrypoint sh $DOCKER_IMAGE:$DOCKER_IMAGE_VERSION
        options:
            mergeEnv: replace
            runFromWorkspaceRoot: true
            outputStyle: stream
            interactive: true
            runInCI: false
            cache: false
            shell: true
