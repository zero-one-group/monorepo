# https://moonrepo.dev/docs/config/project
# yaml-language-server: $schema=https://moonrepo.dev/schemas/v2/project.json
$schema: 'https://moonrepo.dev/schemas/v2/project.json'

layer: application
language: go
toolchains:
    default: null
stack: backend
tags: ['app', 'backend']

# Overrides the name (identifier) of the project
id: '{{ package_name | kebab_case }}'

project:
    title: '{{ package_name | kebab_case }}'
    description: '{{ package_description }}'

tasks:
    dev:
        command: 'air -c air.toml'
        deps: [kill-port]
        options:
            envFile: '/.env'

    build:
        command: 'go build -o build/{{ package_name | kebab_case }}'
        outputs: ['build/{{ package_name | kebab_case }}']
        deps: [tidy]

    start:
        command: 'build/{{ package_name | kebab_case }}'

    test:
        script: 'go test ./... -count=1'
        deps: ['tidy', 'generate-mock']
        options:
            cache: false

    fmt:
        command: 'gofmt -s -w .'
        options:
            cache: false

    generate-mock:
        command: 'mockery'
        options:
            cache: false

    tidy:
        command: 'go mod tidy'

    kill-port:
        # This is a hack for killing the listen port before starting the app
        command: 'pnpm --package=kill-port-process-cli dlx kill-port {{ port_number }}'
        deps: [tidy]
        options:
            internal: true

    migration-create:
        command: 'go run ./cmd/ migrate create'

    migration-up:
        command: 'go run ./cmd/ migrate up'

    migration-down:
        command: 'go run ./cmd/ migrate down'

    migration-reset:
        command: 'go run ./cmd/ migrate reset'

    migration-version:
        command: 'go run ./cmd/ migrate version'

    seed:
        command: 'go run ./cmd/ seed'

    install-mockery:
        command: './scripts/install_mockery.sh v3.5.1'
        options:
            runFromWorkspaceRoot: true
            shell: true
            runInCI: false
            cache: false

    generate-swagger:
        script: 'swag init -o docs --parseDependency'
        options:
            cache: false

    docker-build:
        script: |
            DOCKER_IMAGE="$(jq -r .name <$workspaceRoot'/package.json')-$project" \
            DOCKER_IMAGE_VERSION="$(jq -r .version <$workspaceRoot'/package.json')" \
            && docker build -f $projectRoot/Dockerfile . -t $DOCKER_IMAGE:$DOCKER_IMAGE_VERSION \
            && docker image list --filter reference=$DOCKER_IMAGE\*
        options:
            mergeEnv: replace
            runFromWorkspaceRoot: true
            interactive: false
            outputStyle: stream
            runInCI: false
            cache: false
            shell: true

    docker-run:
        script: |
            DOCKER_IMAGE="$(jq -r .name <$workspaceRoot'/package.json')-$project" \
            DOCKER_IMAGE_VERSION="$(jq -r .version <$workspaceRoot'/package.json')" \
            && docker run --network=host --rm -it --env-file $projectRoot/.env \
              --name $DOCKER_IMAGE $DOCKER_IMAGE:$DOCKER_IMAGE_VERSION
        options:
            mergeEnv: replace
            outputStyle: stream
            runFromWorkspaceRoot: true
            interactive: true
            runInCI: false
            cache: false
            shell: true

    docker-shell:
        script: |
            DOCKER_IMAGE="$(jq -r .name <$workspaceRoot'/package.json')-$project" \
            DOCKER_IMAGE_VERSION="$(jq -r .version <$workspaceRoot'/package.json')" \
            && docker run --network=host --rm -it --env-file $projectRoot/.env \
              --entrypoint sh $DOCKER_IMAGE:$DOCKER_IMAGE_VERSION
        options:
            mergeEnv: replace
            runFromWorkspaceRoot: true
            outputStyle: stream
            interactive: true
            runInCI: false
            cache: false
            shell: true
