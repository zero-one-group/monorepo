# https://moonrepo.dev/docs/config/project
# yaml-language-server: $schema=https://moonrepo.dev/schemas/v2/project.json
$schema: 'https://moonrepo.dev/schemas/v2/project.json'

layer: application
language: typescript
stack: frontend
tags: ['app']

# Overrides the name (identifier) of the project
id: '{{ package_name | kebab_case }}'

project:
    title: {{ package_name | kebab_case }}
    description: '{{ package_description }}'

# Uncomment to use shared UI library
# dependsOn:
#   - 'shared-ui'

# Since this project can infer task from script (package.json), then you can run any script as moon task.
# @see: https://moonrepo.dev/api/types/interface/NodeConfig#inferTasksFromScripts
# Example: `moon {{ package_name | kebab_case }}:start`
tasks:
    dev:
        command: 'pnpm run dev'
        deps: ['prebuild']
        options:
            runDepsInParallel: false
            envFile: '.env'

    lint:
        command: 'oxlint --fix .'

    format:
        command: 'oxfmt .'

    build:
        command: 'pnpm run build'
        deps: ['prebuild']
        options:
            runDepsInParallel: false
            cache: true

    typecheck:
        command: 'pnpm run typecheck'
        deps: ['prebuild']
        options:
            cache: true

    test:
        command: 'pnpm run test'
        deps: ['typegen']
        options:
            cache: false

    # Explicit so moon knows what typegen produces: it can restore the file from cache or
    # rerun, instead of reporting the inferred task as cached with nothing on disk.
    typegen:
        command: 'pnpm run typegen'
        inputs: ['app/routes/**/*', 'tsr.config.json']
        outputs: ['app/routeTree.gen.ts']

    # Explicit (not inferred from package.json) so the generated route tree exists on a
    # clean CI checkout.
    test-coverage:
        command: 'pnpm run test-coverage'
        deps: ['typegen']
        options:
            cache: false

    prebuild:
        deps: ['shared-ui:build', 'typegen']
        options:
            cache: true

    docker-build:
        script: |
            DOCKER_IMAGE="$(jq -r .name <$workspaceRoot'/package.json')-$project" \
            DOCKER_IMAGE_VERSION="$(jq -r .version <$workspaceRoot'/package.json')" \
            && docker build -f $projectRoot/Dockerfile . -t $DOCKER_IMAGE:$DOCKER_IMAGE_VERSION \
            && docker image list --filter reference=$DOCKER_IMAGE\*
        options:
            mergeEnv: replace
            runFromWorkspaceRoot: true
            interactive: false
            outputStyle: stream
            runInCI: false
            cache: false
            shell: true

    docker-run:
        script: |
            DOCKER_IMAGE="$(jq -r .name <$workspaceRoot'/package.json')-$project" \
            DOCKER_IMAGE_VERSION="$(jq -r .version <$workspaceRoot'/package.json')" \
            && docker run --network=host --rm -it \
              --name $DOCKER_IMAGE $DOCKER_IMAGE:$DOCKER_IMAGE_VERSION
        options:
            mergeEnv: replace
            outputStyle: stream
            runFromWorkspaceRoot: true
            interactive: true
            runInCI: false
            cache: false
            shell: true

    docker-shell:
        script: |
            DOCKER_IMAGE="$(jq -r .name <$workspaceRoot'/package.json')-$project" \
            DOCKER_IMAGE_VERSION="$(jq -r .version <$workspaceRoot'/package.json')" \
            && docker run --network=host --rm -it --env-file $projectRoot/.env \
              --entrypoint sh $DOCKER_IMAGE:$DOCKER_IMAGE_VERSION
        options:
            mergeEnv: replace
            runFromWorkspaceRoot: true
            outputStyle: stream
            interactive: true
            runInCI: false
            cache: false
            shell: true
