$schema: https://moonrepo.dev/schemas/v2/project.json
tasks:
  start:
    command: docker stack deploy -c postgresql.yml $STACK_NAME
    options:
      mergeEnv: replace
      runFromWorkspaceRoot: false
      interactive: false
      outputStyle: buffer-only-failure
      runInCI: false
      cache: false
      shell: true
language: unknown
stack: infrastructure
tags:
- config
id: '{{ package_name | kebab_case }}'
project:
  description: '{{ package_description }}'
  title: '{{ package_name | kebab_case }}'
env:
  STACK_NAME: $(jq -r .name <$workspaceRoot'/package.json')
layer: configuration
