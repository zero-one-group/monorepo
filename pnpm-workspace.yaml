# yaml-language-server: $schema=https://www.schemastore.org/pnpm-workspace.json

packages:
    - apps/*
    - packages/*
    - '!**/test/**'

allowBuilds:
    '@swc/core': true
    core-js-pure: true
    esbuild: true
    oxfmt: true
    oxlint: true
    sharp: true
    unrs-resolver: true

catalog:
    npm-check-updates: ^23.1.0
    oxfmt: ^0.64.0
    oxlint: ^1.79.0
    typescript: ~5.9.3

minimumReleaseAgeExclude:
    - '@lucide/astro'
    - '@types/react-dom'
    - lucide-react
    - npm-check-updates

# Force a single @types/react (React 19) inside shared-ui's tree.
# Without this, a hoisted @types/react@18 (pulled by strapi's tree) shadows
# the React 19 types for files under node_modules/@radix-ui/*, which makes
# vite-plugin-dts emit "bigint is not assignable to ReactNode" errors.
# Scoped to @repo/shared-ui so strapi (React 18) is unaffected.
overrides:
    '@repo/shared-ui>@types/react': ^19.2.14
    '@repo/shared-ui>@types/react-dom': ^19.2.5

nodeLinker: hoisted
